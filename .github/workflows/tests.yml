name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Python API helper tests (unit + real-local-HTTP-server integration)
        run: python3 tests/test_umami_api.py

      - name: Python state helper tests (unit + real symlink/FIFO/oversize attack integration)
        run: python3 tests/test_umami_state.py

      - name: Pure JS module (config/period/response-shaping/auth-retry logic)
        run: node tests/test_model.js

      - name: State write/EOF handoff (real Quickshell engine) when available on the runner
        run: |
          if command -v quickshell >/dev/null; then
            timeout 30 quickshell -p tests/test_state_bridge_write.qml
          fi

      - name: QML house style (fonts, palette, text format)
        run: |
          if command -v python3 >/dev/null; then
            if [ -f tests/test_qml_style.py ]; then
              python3 tests/test_qml_style.py
            fi
          fi

      - name: QML parser when available on the runner
        run: |
          if command -v qmlformat >/dev/null; then
            for file in Panel.qml Service.qml RequestBridge.qml StateBridge.qml CredentialManager.qml Sparkline.qml; do
              qmlformat "$file" >/dev/null
            done
          fi
          if command -v qmllint >/dev/null; then
            for file in Panel.qml Service.qml RequestBridge.qml StateBridge.qml CredentialManager.qml Sparkline.qml; do
              qmllint "$file"
            done
          fi

      - name: Omarchy plugin validation when available on the runner
        run: |
          if command -v omarchy >/dev/null; then
            omarchy plugin validate .
          fi
